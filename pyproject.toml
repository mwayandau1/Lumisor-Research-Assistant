[project]
name = "research-agent"
version = "0.1.0"
description = "Autonomous Research Scientist Agent built with LangGraph + LangChain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "arxiv>=2.1.0",
    "supabase>=2.0.0",
    "vecs>=0.4.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]
